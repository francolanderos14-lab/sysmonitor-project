---
- name: Instalar dependencias del sistema
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - policycoreutils-devel
      - setools-console
    state: present

- name: Crear usuario de sistema dedicado para sysmonitor
  ansible.builtin.user:
    name: "{{ sysmonitor_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ sysmonitor_install_dir }}"
    create_home: false

- name: Crear directorio de instalación
  ansible.builtin.file:
    path: "{{ sysmonitor_install_dir }}"
    state: directory
    owner: "{{ sysmonitor_user }}"
    group: "{{ sysmonitor_user }}"
    mode: '0755'

- name: Crear directorio src/ en destino
  ansible.builtin.file:
    path: "{{ sysmonitor_install_dir }}/src"
    state: directory
    owner: "{{ sysmonitor_user }}"
    group: "{{ sysmonitor_user }}"
    mode: '0755'

- name: Crear directorio de logs
  ansible.builtin.file:
    path: "{{ sysmonitor_log_dir }}"
    state: directory
    owner: "{{ sysmonitor_user }}"
    group: "{{ sysmonitor_user }}"
    mode: '0755'

- name: Copiar daemon.py
  ansible.builtin.copy:
    src: ../../../src/daemon.py
    dest: "{{ sysmonitor_install_dir }}/src/daemon.py"
    owner: "{{ sysmonitor_user }}"
    group: "{{ sysmonitor_user }}"
    mode: '0755'

- name: Copiar rotate_logs.py
  ansible.builtin.copy:
    src: ../../../src/rotate_logs.py
    dest: "{{ sysmonitor_install_dir }}/src/rotate_logs.py"
    owner: "{{ sysmonitor_user }}"
    group: "{{ sysmonitor_user }}"
    mode: '0755'

- name: Copiar requirements.txt
  ansible.builtin.copy:
    src: ../../../requirements.txt
    dest: "{{ sysmonitor_install_dir }}/requirements.txt"
    owner: "{{ sysmonitor_user }}"
    group: "{{ sysmonitor_user }}"
    mode: '0644'

- name: Crear entorno virtual con copias reales (no symlinks, por SELinux)
  ansible.builtin.command:
    cmd: python3 -m venv --copies "{{ sysmonitor_install_dir }}/venv"
    creates: "{{ sysmonitor_install_dir }}/venv/bin/python"
  become_user: "{{ sysmonitor_user }}"

- name: Instalar dependencias de Python en el venv
  ansible.builtin.pip:
    requirements: "{{ sysmonitor_install_dir }}/requirements.txt"
    virtualenv: "{{ sysmonitor_install_dir }}/venv"
  become_user: "{{ sysmonitor_user }}"

- name: Generar config.yaml desde plantilla
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ sysmonitor_install_dir }}/config.yaml"
    owner: "{{ sysmonitor_user }}"
    group: "{{ sysmonitor_user }}"
    mode: '0644'
    
- name: Generar .env con el webhook de Discord
  ansible.builtin.copy:
    content: "DISCORD_WEBHOOK_URL={{ discord_webhook_url }}\n"
    dest: "{{ sysmonitor_install_dir }}/.env"
    owner: "{{ sysmonitor_user }}"
    group: "{{ sysmonitor_user }}"
    mode: '0600'

- name: Desplegar unidad systemd del servicio
  ansible.builtin.template:
    src: sysmonitor.service.j2
    dest: /etc/systemd/system/sysmonitor.service
    mode: '0644'
  notify: Recargar systemd y reiniciar sysmonitor

- name: Crear directorio temporal para la política SELinux
  ansible.builtin.file:
    path: /tmp/sysmonitor-selinux
    state: directory
    mode: '0755'

- name: Copiar archivos fuente de la política SELinux
  ansible.builtin.copy:
    src: "../../../selinux/{{ item }}"
    dest: "/tmp/sysmonitor-selinux/{{ item }}"
  loop:
    - sysmonitor.te
    - sysmonitor.if
    - sysmonitor.fc
  loop_control:
    label: "{{ item }}"

- name: Compilar el módulo de política SELinux
  ansible.builtin.command:
    cmd: make -f /usr/share/selinux/devel/Makefile sysmonitor.pp
    chdir: /tmp/sysmonitor-selinux
    creates: /tmp/sysmonitor-selinux/sysmonitor.pp

- name: Instalar el módulo de política SELinux
  ansible.builtin.command:
    cmd: semodule -i /tmp/sysmonitor-selinux/sysmonitor.pp
  register: selinux_module_result
  changed_when: "'already loaded' not in selinux_module_result.stderr"

- name: Aplicar contexto a daemon.py
  community.general.sefcontext:
    target: "{{ sysmonitor_install_dir }}/src/daemon.py"
    setype: sysmonitor_exec_t
    state: present
  notify: Restaurar contextos SELinux

- name: Aplicar contexto a los binarios del venv
  community.general.sefcontext:
    target: "{{ sysmonitor_install_dir }}/venv/bin/python.*"
    setype: sysmonitor_exec_t
    state: present
  notify: Restaurar contextos SELinux

- name: Aplicar contexto a librerías nativas del venv
  community.general.sefcontext:
    target: "{{ sysmonitor_install_dir }}/venv/lib/python3\\.14/site-packages/.+\\.so"
    setype: sysmonitor_exec_t
    state: present
  notify: Restaurar contextos SELinux

- name: Aplicar contexto al directorio de logs
  community.general.sefcontext:
    target: "{{ sysmonitor_log_dir }}(/.*)?"
    setype: sysmonitor_log_t
    state: present
  notify: Restaurar contextos SELinux
